const chunks=tx=>{const ps=[];let cur='';const push=()=>{if(cur)ps.push(cur);cur=''};

function wkTable(a,k){const [f,lb]=MAIN[k],ws=[...new Set(a.map(x=>wk(x.t)))].sort();
 const rows=ws.map(w=>{const g=a.filter(x=>wk(x.t)==w);return{w,n:g.length,p:g.filter(x=>x.pass).length,fl:g.filter(x=>x.skip).length,m:av(g,f),d:av(g,x=>x.db),s:k=='vowel'?av(g,x=>x.semis):null}});
 let h=`<div class="wrap"><table><tr><th>สัปดาห์</th><th>ครั้ง</th><th>ผ่าน</th><th>⚑</th><th>${lb}</th><th>ดัง (dB)</th>${k=='vowel'?'<th>ช่วงเสียง</th>':''}</tr>${rows.map(r=>`<tr><td>${dd(r.w)}</td><td>${r.n}</td><td>${r.p}</td><td>${r.fl}</td><td>${fx(r.m)}</td><td>${fx(r.d)}</td>${k=='vowel'?'<td>'+fx(r.s)+'</td>':''}</tr>`).join('')}</table></div>`;
 if(rows.length>1){const y=rows[rows.length-1],z=rows[rows.length-2],c=(u,v,n)=>v==null||u==null?'':`<span class="${v-u>=0?'up':'down'}">${v-u>=0?'▲':'▼'} ${Math.abs(v-u).toFixed(1)}</span> ${n}`;h+=`<p class="mut">สัปดาห์ล่าสุดเทียบสัปดาห์ก่อน: ${c(z.m,y.m,lb)} · ${c(z.d,y.d,'dB')}</p>`}
 return h}
function trs(a){return a.slice().reverse().slice(0,60).map(x=>`<tr><td>${dd(x.t)} ${new Date(x.t).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}</td><td>${MN[x.mode]}</td><td>${x.lvl+1}/${x.try}</td><td>${x.skip?'⚑':x.pass?'✔':'✖'}</td><td>${x.m}</td><td>${fx(x.sec)}</td><td>${fx(x.db)}</td><td>${fx(x.semis)}</td><td>${x.sim==null?'–':x.sim}</td><td>${x.d??'–'}</td></tr>`).join('')}
const TH='<tr><th>เวลา</th><th>โหมด</th><th>ด่าน/ครั้ง</th><th>ผล</th><th>AI</th><th>วิ</th><th>dB</th><th>เซมิ</th><th>%คำ</th><th>ระดับ</th></tr>';
function stats(){
 const L=rd(LK,[]);if(!L.length){app.innerHTML='<div class="card"><h2>📊 รายงาน</h2><p class="mut">ยังไม่มีข้อมูล ลองเล่นเกมสักครั้งนะ</p></div>';return}
 let h=`<div class="card"><h2>📊 รายงานความก้าวหน้า</h2><p class="mut">ลองทั้งหมด ${L.length} ครั้ง · ผ่าน ${L.filter(x=>x.pass).length} · ⚑ ยังไม่ถึงเป้า ${L.filter(x=>x.skip).length} ด่าน · แต้ม ${rd(PK,0)}<br>สีจุด: 🟢 ผ่าน 🔴 ยังไม่ผ่าน 🟠 ครบ 3 ครั้งยังไม่ถึงเป้า (ข้ามไปด่านต่อ)</p><div class="row" style="justify-content:flex-start;flex-wrap:wrap"><button onclick="csv()">⬇️ CSV</button><button class="alt" onclick="rpt()">⬇️ รายงานสรุป</button></div></div>`;
 for(const k of Object.keys(MODES)){const a=L.filter(x=>x.mode==k);if(!a.length)continue;
  h+=`<div class="card"><h2>${MN[k]}</h2>${k=='vowel'?spark(a,x=>x.sec,'เวลาลากเสียง','วิ')+spark(a,x=>x.db,'ความดัง เทียบครั้งแรก','dB')+spark(a,x=>x.semis,'ช่วงเสียง','เซมิโทน'):spark(a,x=>x.sim,'ความตรงของคำ','%')+spark(a,x=>x.db,'ความดัง','dB')}<b>สรุปรายสัปดาห์</b>${wkTable(a,k)}</div>`}
 app.innerHTML=h+`<div class="card"><b>ทุกครั้งที่ลอง (60 ครั้งล่าสุด รวมครั้งที่พลาด)</b><div class="wrap"><table>${TH}${trs(L)}</table></div></div>`}
function prof(){app.innerHTML=`<div class="card cen"><div style="font-size:56px">🧑</div><h2>คุณทินภัทร</h2><p class="mut">แต้มสะสม ${rd(PK,0)}</p><p><button class="hb sxb" onclick="sfxToggle()">${sxLabel()}</button></p><button onclick="csv()">⬇️ ดาวน์โหลดผล (CSV)</button> <button class="alt" onclick="if(confirm('ลบข้อมูลทั้งหมด?')){wr(LK,[]);wr(PK,0);try{localStorage.removeItem('resona_base')}catch(e){}prof()}">ล้างข้อมูล</button></div>${sttCard()}`}
function sttCard(){return`<div class="card"><h3 style="margin:0 0 6px">🎧 ตัวถอดคำพูด</h3>
 <p style="margin:0">${STTON?'✅ ใช้ตัวถอดคำจากเซิร์ฟเวอร์: '+STTON.map(k=>STT[k]?STT[k].n:k).join(' → '):'ใช้ตัวฟังของเบราว์เซอร์ (เซิร์ฟเวอร์ยังไม่ได้ตั้งคีย์)'}</p>
 <p style="margin:6px 0 0">${TTSV?'🗣 เสียงนก: Gemini (เสียง '+esc(TTSV)+')':'🗣 เสียงนก: เสียงของเบราว์เซอร์ (เซิร์ฟเวอร์ยังไม่ได้ตั้ง GEMINI_API_KEY)'}</p>
 <p class="mut" style="font-size:15px">คีย์อยู่บนเซิร์ฟเวอร์ ไม่อยู่ในเบราว์เซอร์ · เสียงตอนอ่านคำ/ประโยคถูกส่งไปถอดคำที่ผู้ให้บริการ ถ้าใช้ไม่ได้จะกลับไปใช้ตัวฟังของเบราว์เซอร์</p></div>`}
async function save(name,data){try{const d=await claude.use('downloads');if(d)await d.save({filename:name,data})}catch(e){}}
function csv(){const L=rd(LK,[]);save('resona_attempts.csv','\ufeffdate,mode,level,try,result,ai_score,sustain_sec,loud_delta_db,pitch_range_semitone,word_accuracy,voice_stability,quest,flag_not_reached,stt_engine,word_accuracy_browser\n'+L.map(x=>[new Date(x.t).toISOString(),x.mode,x.lvl+1,x.try,x.skip?'not_reached':x.pass?'pass':'retry',x.m,x.sec,x.db,x.semis??'',x.sim??'',x.stab??'',x.q??'',x.skip?1:0,x.eng??'',x.simB??''].join(',')).join('\n'))}
function rpt(){const L=rd(LK,[]);let b=`<h1>รายงานการฝึกพูด Resona (LSVT LOUD)</h1><p>ผู้ใช้: คุณทินภัทร · วันที่ออกรายงาน ${new Date().toLocaleDateString('th-TH')}<br>ลองทั้งหมด ${L.length} ครั้ง · ผ่าน ${L.filter(x=>x.pass).length} · ⚑ ยังไม่ถึงเป้า ${L.filter(x=>x.skip).length} ด่าน</p>`;
 for(const k of Object.keys(MODES)){const a=L.filter(x=>x.mode==k);if(a.length)b+=`<h2>${MN[k]}</h2>${wkTable(a,k)}`}
 b+=`<h2>ทุกครั้งที่ลอง</h2><table>${TH}${trs(L)}</table><p style="color:#666;font-size:12px">หมายเหตุ: ค่า dB เป็นค่าสัมพัทธ์เทียบครั้งแรกของผู้ใช้ (ไม่ใช่ dB SPL) ผลจากเกมเป็นข้อมูลประกอบการติดตามเท่านั้น ไม่ใช่การวินิจฉัย ⚑ = ลองครบ 3 ครั้งแล้วยังไม่ถึงเป้า</p>`;
 save('resona_report.html',`<!doctype html><meta charset="utf-8"><title>Resona report</title><style>body{font-family:sans-serif;margin:24px}table{border-collapse:collapse;font-size:13px}td,th{border:1px solid #bbb;padding:4px 8px;text-align:center}</style>${b}`)}
tab(0);
</script></body></html>
